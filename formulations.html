<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Formulations Slides | Heal Remedies</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1" />
  <!-- Link Swiper's CSS -->
  <link rel="stylesheet" href="./libs/swiper/swiper-bundle.min.css" />

  <!-- Demo styles -->
  <style>
    html,
    body {
      position: relative;
      height: 100%;
    }

    body {
      background: #000;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000;
    }

    .swiper {
      width: 100%;
      height: 100%;
    }

    .swiper-slide {
      overflow: hidden;
    }
  </style>
</head>

<body>
  <!-- Swiper -->

  <div style="--swiper-navigation-color: #fff; --swiper-pagination-color: #fff" class="swiper mySwiper">
    <div class="swiper-wrapper">
      <div class="swiper-slide">
        <div class="swiper-zoom-container">
          <img src="./imgs/prano-vita-1.jpeg" />
        </div>
      </div>
      <div class="swiper-slide">
        <div class="swiper-zoom-container">
          <img src="./imgs/prano-vita-2.jpeg" />
        </div>
      </div>
      <div class="swiper-slide">
        <div class="swiper-zoom-container">
          <img src="./imgs/k2-7-heal.jpeg" />
        </div>
      </div>
      <div class="swiper-slide">
        <div class="swiper-zoom-container">
          <img src="./imgs/folgen-xt.jpeg" />
        </div>
      </div>
      <div class="swiper-slide">
        <div class="swiper-zoom-container">
          <img src="./imgs/hyrise-d3.jpeg" />
        </div>
      </div>
      <div class="swiper-slide">
        <div class="swiper-zoom-container">
          <img src="./imgs/panx-dsr.jpeg" />
        </div>
      </div>
      <div class="swiper-slide">
        <div class="swiper-zoom-container">
          <img src="./imgs/hyace-sp.jpeg" />
        </div>
      </div>
      <div class="swiper-slide">
        <div class="swiper-zoom-container">
          <img src="./imgs/hyace-p.jpeg" />
        </div>
      </div>

      <div class="swiper-slide">
        <div class="swiper-zoom-container">
          <img src="./imgs/cahlshe-glow.jpeg" />
        </div>
      </div>
      <div class="swiper-slide">
        <div class="swiper-zoom-container">
          <img src="./imgs/folgen-xt-2.jpeg" />
        </div>
      </div>
    </div>

  </div>

  <!-- Swiper JS -->
  <script src="./libs/swiper/swiper-bundle.min.js"></script>

  <!-- Initialize Swiper -->
  <script>
    var swiper = new Swiper('.mySwiper', {
      zoom: true,
    });
  </script>
</body>

</html>
